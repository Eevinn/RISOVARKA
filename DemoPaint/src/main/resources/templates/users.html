<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <style>
        body {
          background-color: #f0f0f0;
        }
        .ui.menu {
          border-radius: 0;
        }
        .ui.inverted.menu .item, .ui.inverted.menu .link {
          color: white !important;
        }
        .sidebar {
          width: 180px; /* Adjust sidebar width as needed */
        }
    </style>
</head>
<body>

<div class="ui inverted menu">
    <div class="header item">
        <h1>Рисоварка</h1>
    </div>
    <a class="item" href="/">Главная</a>
    <div class="right menu">
        <a th:if="${#authorization.expression('isAuthenticated()')}" class="item" href="/logout">Выйти</a>
        <a th:unless="${#authorization.expression('isAuthenticated()')}" class="item" href="/login">Войти</a>
    </div>
</div>

<div class="ui grid">
    <div class="four wide column sidebar">
        <div class="ui vertical menu">
            <a href="/admin/adminPage" class="item">Главная страница админа</a>
            <a href="#" class="item">Доски пользователей</a>
            <a href="#" class="item">Настройки</a>
        </div>
    </div>
    <div class="twelve wide column">
        <div class="ui container">
            <div class="main-container clearfix gutter-lg">
                <div class="container">
                    <h1>Все пользователи</h1>
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя пользователя</th>
                            <th>Роль</th>
                            <th>Профиль</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="person : ${persons}">
                            <td th:text="${person.id}"></td>
                            <td th:text="${person.username}"></td>
                            <td th:text="${person.role}"></td>
                            <td>
                                <div class="action-icons">
                                    <a th:href="@{/admin/users/{id}(id=${person.id})}">Посмотреть профиль</a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
        </div>
    </div>
</div>


</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
