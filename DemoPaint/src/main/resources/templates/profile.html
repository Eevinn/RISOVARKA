<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <style>
        .main-container {
            margin-top: 2em;
        }
        .ui.table {
            width: 50%;
            margin: 2em auto;
        }
        .ui.menu {
            border-radius: 0;
        }
        .ui.menu .header h1 {
          margin: 0;
        }

        @media (max-width: 767px) { /* Для маленьких экранов */
            .ui.menu .right.menu {
                float: none;
                text-align: center;
            }
        }

    </style>
</head>
<body>

<div class="ui inverted menu">
    <div class="header item">
        <h1>Рисоварка</h1>
    </div>
    <div class="right menu">
        <a th:if="${#authorization.expression('isAuthenticated()')}" class="item" href="/logout">Выйти</a>
        <a th:unless="${#authorization.expression('isAuthenticated()')}" class="item" href="/login">Войти</a>
    </div>
</div>


<div class="ui container">
    <div class="ui segment">
        <div class="ui grid">
            <div class="twelve wide column">
                <h2 class="ui header"> Имя пользователя: <span th:text="${user.username}">Имя пользователя</span></h2>
                <p>Роль пользователя: <span th:text="${user.role}">Роль пользователя</span></p>
            </div>
        </div>
    </div>


    <div class="ui segment">
        <h2 class="ui header">Доски пользователя:</h2>
        <h2 class="ui header">Общее количество досок пользователя: </h2>

        <div class="card" th:each="board : ${boards}">
            <div class="content">
                <div class="header" th:text="${board.name}">Название доски</div>
            </div>
            <div class="extra content">
                <a th:href="@{'http://localhost:5173/' + ${board.id}}" class="ui primary button">Открыть</a>
                <form th:action="@{/board/{id}(id=${board.id})}" th:method="POST" style="display:inline;">
                    <input type="hidden" name="_method" value="delete" />
                    <button class="ui red button" type="submit">Удалить</button>
                </form>
            </div>
        </div>
    </div>


    <div class="ui segment">
        <h2 class="ui header">Активность пользователя</h2>
        <table class="ui celled table">
            <thead>
            <tr>
                <th></th>
                <th>Login Time</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="timestamp, iterStat : ${loginTimestamps}">
                <td th:text="${iterStat.index + 1}"></td>
                <td th:text="${#temporals.format(timestamp.loginTime, 'dd.MM.yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
