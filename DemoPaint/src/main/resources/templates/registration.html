<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
</head>

<header class="header">
    <h1>Рисоварка</h1>
    <div>
        <form th:action="@{/logout}" method="post" th:object="${_csrf}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button  type="submit">Выйти из аккаунта</button>
        </form>
    </div>
    <div>
        <button type="button" onclick="location.href='/login'">Зайти в аккаунт</button>
    </div>
    <div>
        <button type="button" onclick="location.href='/registration'">Зарегистрироваться</button>
    </div>

</header>

<style>
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;jl
    }
</style>

<body>
<h1>Регистрация</h1>
<form method="post" action="/createAccount">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <label for="username">Логин:</label>
    <input type="text" id="username" name="username"><br><br>

    <label for="email">email:</label>
    <input type="text" id="email" name="email"><br><br>

    <label for="password">Пароль:</label>
    <input type="password" id="password" name="password"><br><br>

    <input type="submit" value="Создать">
</form>
<a th:href="@{../login}">Уже есть аккаунт? Войдите здесь!</a>
</body>

</html>
