<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <!-- Подключение Semantic UI CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <!-- Подключение Semantic UI JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</head>
<body>

<div class="ui grid">
    <!-- Левое меню с информацией о пользователе -->
    <div class="four wide column">
        <div class="ui vertical menu" style="width: 100%; height: 100vh;">
            <div class="item">
                <div class="ui small circular image">
                    <!-- Аватар пользователя; можно заменить заглушкой или картинкой профиля -->
                </div>
                <br>
                <div class="content">
                    <!--                    <h3 class="ui header" th:text="${user.login}">Имя пользователя</h3>-->
                    <!--                    <p th:text="${user.email}">user@example.com</p>-->
                </div>
            </div>
            <div class="ui divider"></div>
            <!-- Ссылки меню -->
            <a class="item" href="/home">
                <i class="sign-out icon"></i>
                <div>
                    <form th:action="@{/logout}" method="post" th:object="${_csrf}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button  type="submit">Выйти из аккаунта</button>
                    </form>
                </div>
            </a>
        </div>
    </div>

    <!-- Основная часть личного кабинета -->
    <div class="twelve wide column">
        <div class="ui container" style="padding: 20px;">
            <p>Здесь вы можете изменить настройки своего профиля, обновить личные данные и настроить параметры безопасности.</p>

            <!-- Пример раздела "Информация о профиле" -->
            <h3 class="ui header">Информация о профиле</h3>
            <div class="ui form">
                <div class="field">
                    <label>Логин</label>
                </div>
                <div class="field">
                    <label>Email</label>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
