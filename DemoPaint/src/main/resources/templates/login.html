<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>

<header class="header">
    <h1>Рисоварка</h1>
    <div>
        <form th:action="@{/logout}" method="post" th:object="${_csrf}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button  type="submit">Выйти из аккаунта</button>
        </form>
    </div>
    <div>
        <button type="button" onclick="location.href='/login'">Зайти в аккаунт</button>
    </div>
    <div>
        <button type="button" onclick="location.href='/registration'">Зарегистрироваться</button>
    </div>

</header>

<body>
<style>

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
    }
</style>

<form method="post" action="/login">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <h1>Вход в аккаунт</h1>
    <label for="username">Логин:</label>
    <input type="text" id="username" name="username"><br><br>

    <label for="password">Пароль:</label>
    <input type="password" id="password" name="password"><br><br>

    <input type="submit" value="Войти">
</form>

<h1>Ещё нет аккаунта? Зарегистрируйтесь: </h1>
<a th:href="@{../registration}">Зарегистрироваться</a>

</form>

</body>
</html>
