<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
</head>
<body>

<div class="ui container">

    <form method="post" action="/login" class="ui form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <h2 class="ui dividing header">Вход в аккаунт</h2>

        <div class="field">
            <label for="username">Логин:</label>
            <input type="text" id="username" name="username" placeholder="Введите логин">
        </div>

        <div class="field">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль">
        </div>

        <button class="ui primary button" type="submit">Войти</button>
    </form>

    <div class="ui message">
        Ещё нет аккаунта?
        <a th:href="@{../registration}" class="ui blue link">Зарегистрируйтесь</a>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
