<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</head>

<style>
    body {
      background-color: #f0f0f0; /* Светло-серый фон */
    }
    .ui.form {
      max-width: 400px;
      margin: 0 auto;
      background-color: white;
      padding: 30px;
      border-radius: 5px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
    .flex-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100px;
  }
        }
        .main-container {
            padding: 2em;
        }
        .hero-section {
            background-color: #4285f4; /* Blue hero background */
            color: white;
            padding: 5em 0;
            text-align: center;
        }
        .hero-section h1 {
            font-size: 3em;
            margin-bottom: 1em;
        }
        .feature-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 3em;
        }
        .feature {
            width: 30%;
            margin-bottom: 2em;
            padding: 2em;
            background-color: white;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .feature i {
            font-size: 2em;
            margin-bottom: 1em;
        }
        .feature h3 {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .feature {
                width: 100%;
            }
        }

</style>

<body>

<div class="ui inverted menu" style="border-radius: 0">
    <div class="header item">
        <h1>Рисоварка</h1>
    </div>
    <div class="right menu">
        <a th:if="${#authorization.expression('isAuthenticated()')}" class="item" href="/logout">Выйти</a>
        <a th:unless="${#authorization.expression('isAuthenticated()')}" class="item" href="/login">Войти</a>
    </div>
    <div class="center menu">
        <a th:unless="${#authorization.expression('isAuthenticated()')}" class="item" href="/registration">Зарегистрироваться</a>
    </div>
    <div class="center menu">
        <a class="item" href="/">На главную</a>
    </div>
</div>

<div class="ui container">
    <div class="ui segment">
        <div class="flex-container">
            <h2 class="ui header">Войдите в аккаунт</h2>
        </div>
        <form class="ui form" action="/process_login" method="post">
            <div class="field">
                <label>Имя пользователя</label>
                <input type="text" name="username" placeholder="Имя пользователя" required>
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <input type="hidden" name="referer" th:value="${param.referer}" />

            <div class="ui error message" th:if="${param.error}">
                <p>Неверное имя пользователя или пароль.</p>
            </div>
            <div class="ui success message" th:if="${param.logout}">
                <p>Вы успешно вышли из аккаунта.</p>
            </div>
            <button class="ui button primary" type="submit">Войти</button>
        </form>
        <div class="ui divider"></div>
        <div class="flex-container">
            <a href="/registration" class="ui inverted blue button">Зарегистрироваться</a>
        </div>
    </div>
</div>

</body>
</html>
