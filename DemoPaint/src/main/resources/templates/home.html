<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;jl
        }
    </style>
</head>

<header class="header">
    <h1>Рисоварка</h1>
    <div>
        <form th:action="@{/logout}" method="post" th:object="${_csrf}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button  type="submit">Выйти из аккаунта</button>
        </form>
    </div>
    <div>
        <button type="button" onclick="location.href='/login'">Зайти в аккаунт</button>
    </div>
    <div>
        <button type="button" onclick="location.href='/registration'">Зарегистрироваться</button>
    </div>

</header>

</body>
</html>
