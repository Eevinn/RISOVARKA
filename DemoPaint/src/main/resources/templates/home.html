<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Рисоварка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
</head>
<body>
<div class="ui container">
    <header class="ui large secondary pointing menu">
        <a href="/" class="header item">
            <h1>Рисоварка</h1>
        </a>
        <div class="right menu" >
            <div class="ui dropdown item" >
                <div class="menu">
                    <a href="/login" class="item">Вход</a>
                    <a href="/registration" class="item">Регистрация</a>
                    <form th:action="@{/logout}" method="post" th:object="${_csrf}" class="item">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="ui button">Выход</button>
                    </form>
                </div>
            </div>
            <a href="http://localhost:5173/" class="item">Доска</a>
        </div>
    </header>

    <div class="ui text container">
        <h2 class="ui center aligned icon header">
            <i class="paint brush icon"></i>
            <div class="content">
                Рисоварка — ваше пространство для творчества!
            </div>
        </h2>
        <p>
            Здесь вы можете рисовать, делиться своими шедеврами, вдохновляться работами других пользователей и просто приятно проводить время.
        </p>
        <div class="ui buttons">
            <a href="/login" class="ui primary button">Войти</a>
            <a href="/registration" class="ui button">Регистрация</a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
