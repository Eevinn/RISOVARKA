<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Администратор</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        .ui.table {
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .ui.primary.button {
            background-color: #218838; /* Зеленый цвет */
        }

        .ui.negative.button {
            background-color: #db2828; /* Красный цвет */
        }
    </style>
</head>

<header class="ui secondary pointing menu">
    <a href="/" class="header item">
        <h1>Рисоварка</h1>
    </a>
    <div class="right menu">
        <div class="ui dropdown item">
            <i class="user icon"></i>
            <div>
                <form th:action="@{/logout}" method="post" th:object="${_csrf}" class="item">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="ui button">Выйти из аккаунта администратора</button>
                </form>
            </div>
        </div>
    </div>
</header>

<body>
<div class="ui container">
    <h2 class="ui center aligned icon header">
        <i class="settings icon"></i>
        <div class="content">
            Панель администратора
        </div>
    </h2>

    <div class="ui segment">
        <h3 class="ui header">Список пользователей</h3>
        <table class="ui celled table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Логин</th>
                <th>Email</th>
                <th>Роль</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.login}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.role}"></td>
                <td>
                    <form th:action="@{/employee/delete/{id}(id=${user.id})}" method="post">
                        <button type="submit" class="ui negative button">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.4.1/semantic.min.js"></script>
</body>
</html>
